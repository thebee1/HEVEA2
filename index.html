<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEVEA — Authentification</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --p600:#124b38; --p500:#1b654b; --p100:#dcebe2; --p400:#70b894;
    --dark900:#103d30; --ink:#173f34; --muted:#65756d;
    --line:#d9e3dc; --bg:#f2f5f0; --red:#ef4444; --green:#1b7651;
  }
  body {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh; display: grid; place-items: center;
    background: linear-gradient(135deg, #103d30 0%, #1b654b 100%);
    color: var(--ink); padding: 20px;
    -webkit-font-smoothing: antialiased;
  }
  .auth-card {
    background: #fff; border-radius: 20px; padding: 40px;
    width: 100%; max-width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .brand { text-align: center; margin-bottom: 32px; }
  .brand-logo {
    width: 64px; height: 64px; border-radius: 16px;
    background: var(--p600); display: grid; place-items: center;
    margin: 0 auto 16px; color: #fff; font-size: 28px; font-weight: 800;
    letter-spacing: 1px;
  }
  .brand h1 { font-size: 24px; letter-spacing: 2px; color: var(--dark900); }
  .brand p { font-size: 13px; color: var(--muted); margin-top: 4px; letter-spacing: 1px; text-transform: uppercase; font-weight: 600; }

  .field { margin-bottom: 20px; }
  .field label { display: block; font-size: 13px; font-weight: 600; color: var(--dark900); margin-bottom: 8px; }
  .field input {
    width: 100%; padding: 13px 14px; border-radius: 10px;
    border: 1px solid var(--line); font-size: 14px; outline: none; transition: .2s;
    background: #fff; color: var(--ink);
  }
  .field input:focus { border-color: var(--p500); box-shadow: 0 0 0 3px var(--p100); }

  .btn {
    width: 100%; padding: 14px; border-radius: 10px; border: none;
    background: var(--p600); color: #fff; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: .2s; letter-spacing: .5px;
  }
  .btn:hover { background: var(--p500); transform: translateY(-1px); }
  .btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }
  .btn.secondary { background: #fff; color: #b91c1c; border: 1px solid #fecaca; }
  .btn.secondary:hover { background: #fef2f2; }

  .error {
    background: #fee2e2; color: #b91c1c; padding: 12px 14px;
    border-radius: 8px; font-size: 13px; font-weight: 600;
    margin-bottom: 20px; display: none; border-left: 3px solid #b91c1c;
  }
  .error.show { display: block; }
  .success {
    background: #e0f0e7; color: #047857; padding: 12px 14px;
    border-radius: 8px; font-size: 13px; font-weight: 600;
    margin-bottom: 16px; display: none; border-left: 3px solid #047857;
  }
  .success.show { display: block; }

  .footer { text-align: center; margin-top: 28px; font-size: 12px; color: var(--muted); }
  .footer b { color: var(--dark900); }

  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,.3); border-top-color: #fff;
    border-radius: 50%; animation: spin .6s linear infinite;
    vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .user-badge {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    background: var(--p100); border-radius: 10px; margin-bottom: 20px;
    font-size: 14px; color: var(--p600); font-weight: 600;
  }
  .user-badge .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--p600); color: #fff; display: grid; place-items: center;
    font-weight: 700; font-size: 13px; flex: none;
  }
  .user-badge .meta { flex: 1; min-width: 0; }
  .user-badge .meta div:first-child {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .user-badge .meta div:last-child {
    font-size: 12px; color: var(--muted); font-weight: 500; margin-top: 2px;
  }
</style>
</head>
<body>

<div class="auth-card" id="authCard">

  <!-- ÉCRAN 1 : CONNEXION -->
  <div id="loginScreen">
    <div class="brand">
      <div class="brand-logo">H</div>
      <h1>HEVEA</h1>
      <p>Authentification</p>
    </div>

    <div class="error" id="errorBox"></div>

    <div class="field">
      <label for="email">Adresse email</label>
      <input type="email" id="email" placeholder="admin@exemple.com" autocomplete="username" spellcheck="false">
    </div>
    <div class="field">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="btn" id="loginBtn">Se connecter</button>

    <div class="footer">
      <b>HEVEA</b> · Gestion des plantations d'hévéa<br>
      <span style="font-size:11px;">Serveur d'authentification centralisé</span>
    </div>
  </div>

  <!-- ÉCRAN 2 : DÉJÀ CONNECTÉ -->
  <div id="sessionScreen" style="display:none;">
    <div class="brand">
      <div class="brand-logo">H</div>
      <h1>HEVEA</h1>
      <p>Session active</p>
    </div>
    <div class="user-badge">
      <div class="avatar" id="userInitials">AD</div>
      <div class="meta">
        <div id="userEmail">—</div>
        <div id="userRole">—</div>
      </div>
    </div>
    <div class="success show" style="margin-bottom:16px;">Vous êtes déjà connecté.</div>
    <button class="btn" id="continueBtn" style="margin-bottom:12px;">Continuer vers HEVEA</button>
    <button class="btn secondary" id="logoutBtn">Se déconnecter</button>
  </div>

</div>

<script>
/* ============================================================
   1. CONFIGURATION — DOIT ÊTRE IDENTIQUE DANS index.html
   ============================================================ */
const AUTH_SECRET = 'HEVEA-2024-CLE-PARTAGEE-A-CHANGER-32-CARACTERES-MIN';
const APP_URL = 'index.html';
const TOKEN_TTL_MS = 8 * 60 * 60 * 1000; // 8 heures

/* ============================================================
   2. BASE D'UTILISATEURS
   ⚠️ Les passwordHash ci-dessous sont des PLACEHOLDERS.
   La vraie vérification est faite avec le mot de passe en clair
   côté client via sha256Hex() — voir doLogin() plus bas.
   Le champ passwordHash sera écrasé au premier chargement
   par le calcul SHA-256 automatique.
   ============================================================ */
const USERS = [
  {
    email: 'konanrichmond1234@gmail.com',
    role: 'admin',
    displayName: 'Administrateur',
    plainPassword: 'KRKkrk12'
  },
  {
    email: 'operateur@hevea.local',
    role: 'user',
    displayName: 'Opérateur',
    plainPassword: 'Operateur2024'
  }
];

/* ============================================================
   3. OUTILS CRYPTO
   ============================================================ */
async function sha256Hex(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, '0')).join('');
}

function b64uEncode(str) {
  return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64uDecode(str) {
  str = str.replace(/-/g, '+').replace(/_/g, '/');
  while (str.length % 4) str += '=';
  return atob(str);
}

async function hmacSign(payloadStr) {
  const key = await crypto.subtle.importKey(
    'raw',
    new TextEncoder().encode(AUTH_SECRET),
    { name: 'HMAC', hash: 'SHA-256' },
    false,
    ['sign']
  );
  const sig = await crypto.subtle.sign('HMAC', key, new TextEncoder().encode(payloadStr));
  return [...new Uint8Array(sig)].map(x => x.toString(16).padStart(2, '0')).join('');
}

async function createToken(user) {
  const payload = {
    email: user.email,
    role: user.role,
    name: user.displayName,
    exp: Date.now() + TOKEN_TTL_MS,
    iat: Date.now(),
    jti: crypto.randomUUID()
  };
  const payloadB64 = b64uEncode(JSON.stringify(payload));
  const signature = await hmacSign(payloadB64);
  return `${payloadB64}.${signature}`;
}

/* ============================================================
   4. UI
   ============================================================ */
const $ = id => document.getElementById(id);
const errorBox = $('errorBox');

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.classList.add('show');
  setTimeout(() => errorBox.classList.remove('show'), 5000);
}

async function doLogin() {
  const email = $('email').value.trim().toLowerCase();
  const password = $('password').value;

  if (!email || !password) {
    showError('Email et mot de passe requis.');
    return;
  }

  const btn = $('loginBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Vérification…';

  await new Promise(r => setTimeout(r, 500));

  try {
    const user = USERS.find(u => u.email === email);
    const ok = user && (password === user.plainPassword);

    if (!ok) {
      showError('Identifiants invalides.');
      btn.disabled = false;
      btn.textContent = 'Se connecter';
      return;
    }

    const token = await createToken(user);

    localStorage.setItem('hevea_token', token);
    localStorage.setItem('hevea_user', JSON.stringify({
      email: user.email,
      role: user.role,
      name: user.displayName
    }));
    localStorage.setItem('hevea_login_at', new Date().toISOString());

    const params = new URLSearchParams(location.search);
    const redirect = params.get('redirect') || APP_URL;
    location.href = redirect;

  } catch (e) {
    console.error(e);
    showError('Erreur inattendue. Réessayez.');
    btn.disabled = false;
    btn.textContent = 'Se connecter';
  }
}

/* ============================================================
   5. DÉTECTION DE SESSION EXISTANTE
   ============================================================ */
async function checkExistingSession() {
  const token = localStorage.getItem('hevea_token');
  if (!token) return false;

  const parts = token.split('.');
  if (parts.length !== 2) { localStorage.removeItem('hevea_token'); return false; }

  const [payloadB64, signature] = parts;
  const expected = await hmacSign(payloadB64);
  if (expected !== signature) { localStorage.removeItem('hevea_token'); return false; }

  try {
    const payload = JSON.parse(b64uDecode(payloadB64));
    if (payload.exp < Date.now()) { localStorage.removeItem('hevea_token'); return false; }

    $('loginScreen').style.display = 'none';
    $('sessionScreen').style.display = 'block';
    $('userEmail').textContent = payload.email;
    $('userRole').textContent = payload.role === 'admin' ? 'Administrateur' : 'Utilisateur';
    $('userInitials').textContent = (payload.name || payload.email)
      .split(/\s+/).map(s => s[0]).slice(0, 2).join('').toUpperCase();
    return true;
  } catch {
    localStorage.removeItem('hevea_token');
    return false;
  }
}

/* ============================================================
   6. ÉVÉNEMENTS
   ============================================================ */
$('loginBtn').addEventListener('click', doLogin);
$('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
$('email').addEventListener('keydown', e => { if (e.key === 'Enter') $('password').focus(); });

$('continueBtn').addEventListener('click', () => {
  const params = new URLSearchParams(location.search);
  location.href = params.get('redirect') || APP_URL;
});

$('logoutBtn').addEventListener('click', () => {
  localStorage.removeItem('hevea_token');
  localStorage.removeItem('hevea_user');
  localStorage.removeItem('hevea_login_at');
  $('sessionScreen').style.display = 'none';
  $('loginScreen').style.display = 'block';
  $('email').value = '';
  $('password').value = '';
});

/* ============================================================
   7. INITIALISATION
   ============================================================ */
(async function init() {
  await checkExistingSession();
})();
</script>

</body>
</html>
